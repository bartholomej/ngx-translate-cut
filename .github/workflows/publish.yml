name: 🚀 Publish to NPM

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🚀 Publish to NPM

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔧 Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: 📦 Install dependencies
        # Use immutable install on CI to prevent accidental lockfile changes
        run: yarn install --immutable

      - name: 🔄 Sync versions
        run: yarn syncprojects

      - name: 🏗️ Build demo app
        run: yarn build:demo --base-href https://bartholomej.github.io/ngx-translate-cut/

      - name: 🏗️ Build library
        run: yarn build

      - name: 🧪 Run tests
        run: yarn test --watch=false --coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: 🚀 Publish NPM
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'next') == false
        run: cd dist/ngx-translate-cut && npm publish --access public

      - name: 🚀 Publish NPM (NEXT)
        if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, 'next') == true
        run: cd dist/ngx-translate-cut && npm publish --access public --tag next

      - name: 🚀 Deploy Github Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./dist/demo/browser
