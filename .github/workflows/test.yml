name: 🧪 Build & run all tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: 🧪 Build & run all tests

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v6

      - name: 📦 Enable Corepack
        run: corepack enable

      - name: 🔧 Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: 📦 Install dependencies
        # Use immutable install on CI to prevent accidental lockfile changes
        run: yarn install --immutable

      - name: 🔄 Sync versions
        run: yarn syncprojects

      - name: 🏗️ Build library
        run: yarn build

      - name: 🏗️ Build demo app
        run: yarn build:demo --base-href https://bartholomej.github.io/ngx-translate-cut/

      - name: 🧪 Run tests
        run: yarn test --watch=false --coverage

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
